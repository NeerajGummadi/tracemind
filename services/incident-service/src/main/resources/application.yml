spring:
  application:
    name: incident-service
  datasource:
    # 55432, not 5432 - see the port note on the postgres service in docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:55432/tracemind}
    username: ${DB_USERNAME:tracemind}
    password: ${DB_PASSWORD:tracemind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      properties:
        # Without this, KafkaTemplate.send() can block for Kafka's own default
        # of 60s fetching producer metadata against an unreachable broker,
        # before our own send-timeout-ms (below) ever gets a chance to apply -
        # found during Milestone F's real Kafka-down validation. Keep in sync
        # with outbox.publisher.send-timeout-ms.
        max.block.ms: 5000

outbox:
  publisher:
    batch-size: 50
    poll-interval-ms: 1000
    send-timeout-ms: 5000

server:
  port: 8082
