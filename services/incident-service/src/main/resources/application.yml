spring:
  application:
    name: incident-service
  datasource:
    # 55432, not 5432 - see the port note on the postgres service in docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:55432/tracemind}
    username: ${DB_USERNAME:tracemind}
    password: ${DB_PASSWORD:tracemind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8082
