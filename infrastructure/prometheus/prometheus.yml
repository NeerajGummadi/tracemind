global:
  scrape_interval: 5s

# host.docker.internal lets the containerized Prometheus reach the demo
# metrics exporter running on the host (see infrastructure/prometheus/
# demo_metrics_exporter.py) - same mechanism already relied on nowhere
# else in this project, but standard for Docker Desktop on macOS.
scrape_configs:
  - job_name: tracemind-demo-metrics
    static_configs:
      - targets: ["host.docker.internal:9105"]
